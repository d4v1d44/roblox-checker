<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Brute Forcer</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 300px;
        }
        h1 { color: #333; margin-bottom: 20px; }
        input { 
            padding: 12px; 
            width: 100%; 
            margin-bottom: 15px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box;
        }
        button { 
            padding: 12px 20px; 
            background-color: #0074e0; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #005bb5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roblox Brute Forcer</h1>
        <input type="email" id="email" placeholder="Exemplo@gmail.com">
        <button onclick="startAttack()">INICIAR ATAQUE</button>
    </div>

    <script>
        function startAttack() {
            const email = document.getElementById('email').value;
            if (!email) {
                alert("Digite um email!");
                return;
            }

            fetch('/start-brute-force', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Ataque iniciado! Verifique o Discord.");
                } else {
                    alert("Erro: " + data.error);
                }
            })
            .catch(error => {
                alert("Erro de conexão com o servidor!");
                console.error('Erro:', error);
            });
        }
    </script>
</body>
</html>
