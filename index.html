<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Email Brute Force</title>
    <style>
        body { font-family: sans-serif; background: #232336; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #181825; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00b060; margin-top: 0; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #444; border-radius: 6px; background: #2f2f45; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00b060; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #009950; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
        .success { color: #00b060; }
        .error { color: #ff4d4d; }
        .info { color: #ccc; font-size: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2>📧 Email Brute Force</h2>
    <p class="info">Insira o Email da vítima. O Bot vai testar automaticamente as senhas do arquivo `senhas.txt`.</p>
    
    <label>Email da Conta Roblox</label>
    <input type="email" id="emailInput" placeholder="exemplo@gmail.com">

    <button onclick="startAttack()">Iniciar Ataque</button>

    <div id="status"></div>
</div>

<script>
    async function startAttack() {
        const email = document.getElementById('emailInput').value;
        const statusDiv = document.getElementById('status');
        const btn = document.querySelector('button');

        if (!email || !email.includes('@')) {
            statusDiv.innerHTML = '<span class="error">Coloca um Email válido!</span>';
            return;
        }

        statusDiv.innerHTML = '<span class="success">Enviando Email para o Bot...</span>';
        btn.disabled = true;
        btn.innerText = "Aguardando...";

        try {
            const response = await fetch('/start-brute-force', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await response.json();

            if (data.success) {
                statusDiv.innerHTML = '<span class="success">✅ Ataque Iniciado! Verifique o Discord em instantes.</span>';
            } else {
                statusDiv.innerHTML = `<span class="error">❌ Erro: ${data.error}</span>`;
            }

        } catch (e) {
            statusDiv.innerHTML = '<span class="error">❌ Erro de Conexão com o Servidor</span>';
        } finally {
            btn.disabled = false;
            btn.innerText = "Iniciar Ataque";
        }
    }
</script>

</body>
</html>
